<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RQ Kitchen — الكاشير</title>
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top select{width:auto;font-size:15px;padding:8px 12px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:19px;margin:0 0 4px}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
.big{font-size:40px;font-weight:700;text-align:center;letter-spacing:.08em;direction:ltr}
.qrwrap{text-align:center}
#qr{background:#fff;padding:14px;border-radius:16px;display:inline-block;margin:10px 0}
#qr img,#qr canvas{display:block;width:240px;height:240px}
.tag{display:inline-block;background:var(--orange);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;font-size:22px;direction:ltr}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border:1px solid var(--line);border-top:6px solid var(--orange);border-radius:14px;padding:12px 14px;background:var(--paper)}
.card[data-s="ready"]{border-top-color:var(--green)}
.card header{display:flex;justify-content:space-between;align-items:center}
.card .n{font-size:28px;font-weight:700;direction:ltr}
.meta{font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b{font-size:12px;border-radius:8px;padding:1px 8px;font-weight:700}
.b.on{background:#E4F4EA;color:#156B3A}.b.off{background:#FCE9E6;color:#A0281C}.b.here{background:var(--green);color:#fff}
.card .btn{margin-top:10px;padding:10px;font-size:15px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
#login{max-width:340px;margin:12vh auto;text-align:center}
.err{color:var(--red);font-size:14px;min-height:22px;margin:8px 0 0}
</style>
</head>
<body>
<section id="login" class="panel" hidden>
  <div class="logo" style="justify-content:center"><b>RQ</b><span>KITCHEN</span></div>
  <h1 style="margin-top:14px">دخول الكاشير</h1>
  <input id="pin" class="big" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" aria-label="رمز الدخول">
  <p class="err" id="perr"></p>
  <button class="btn primary" id="go">دخول</button>
</section>

<div id="appwrap" hidden>
<div class="top">
  <div class="logo"><b>RQ</b><span>KITCHEN</span></div>
  <select id="branch" aria-label="الفرع">
    <option value="MBZ">فرع MBZ</option><option value="Al Wathba">فرع الوثبة</option>
    <option value="Al Nahyan">فرع آل نهيان</option><option value="Al Ain">فرع العين</option>
  </select>
</div>
<main class="grid">
  <section class="panel" id="newp">
    <div id="form">
      <h1>طلب جديد</h1>
      <label for="num">رقم الطلب من الفاتورة</label>
      <input id="num" class="big" inputmode="numeric" maxlength="6" placeholder="000">
      <button class="btn primary" id="make">إنشاء رمز التتبع</button>
    </div>
    <div id="qrv" class="qrwrap" hidden>
      <div>طلب رقم <span class="tag" id="qn"></span></div>
      <div id="qr"></div>
      <p class="sub">خلّ العميل يمسح الرمز بكاميرا جواله ويضغط «فعّل التنبيه»</p>
      <button class="btn dark" id="again">طلب جديد</button>
    </div>
  </section>
  <section>
    <h2>الطلبات المفتوحة</h2>
    <p class="sub">لما يسلّمك المطبخ الطلب، اضغط «جاهز» ويوصل التنبيه لجوال العميل.</p>
    <div class="list" id="list"><div class="empty">جاري التحميل…</div></div>
  </section>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const API="https://dhqgorvtwgzekmmjztyr.supabase.co/functions/v1/track";
const SITE=location.origin;
const $=s=>document.querySelector(s);
let pin=localStorage.getItem("rq_pin")||"", busy=false, timer=null;
$("#branch").value=localStorage.getItem("rq_branch")||"MBZ";
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),3800)}
async function call(a,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({a,pin,...extra})});const j=await r.json().catch(()=>({}));
  if(r.status===401){logout();throw new Error("pin")} if(!r.ok) throw new Error(j.error||"error"); return j}
function logout(){localStorage.removeItem("rq_pin");pin="";$("#appwrap").hidden=true;$("#login").hidden=false;clearTimeout(timer)}
async function login(p){pin=p;try{await call("login");localStorage.setItem("rq_pin",p);$("#login").hidden=true;$("#appwrap").hidden=false;load()}catch(e){$("#perr").textContent=e.message==="pin"?"الرمز غير صحيح":"تعذّر الاتصال، تأكد من الإنترنت"}}
$("#go").onclick=()=>login($("#pin").value.trim());
$("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
$("#branch").onchange=()=>{localStorage.setItem("rq_branch",$("#branch").value);load()};
$("#num").addEventListener("input",e=>e.target.value=e.target.value.replace(/\D/g,""));
$("#num").addEventListener("keydown",e=>{if(e.key==="Enter")$("#make").click()});
$("#again").onclick=()=>{$("#qrv").hidden=true;$("#form").hidden=false;$("#num").focus()};
$("#make").onclick=async()=>{
  const num=$("#num").value.trim(); if(!num){toast("اكتب رقم الطلب أولاً");$("#num").focus();return}
  $("#make").disabled=true;
  try{const j=await call("create",{num,branch:$("#branch").value}); showQR(j.order); if(j.existing) toast("الطلب "+num+" موجود مسبقاً — هذا رمزه"); $("#num").value=""; load()}
  catch(e){if(e.message!=="pin")toast("تعذّر إنشاء الطلب، حاول مرة ثانية")}
  $("#make").disabled=false;
};
function showQR(o){$("#form").hidden=true;$("#qrv").hidden=false;$("#qn").textContent="#"+o.num;$("#qr").innerHTML="";
  new QRCode($("#qr"),{text:SITE+"/o/"+o.id,width:480,height:480,correctLevel:QRCode.CorrectLevel.M})}
async function act(id,a,btn){
  btn.disabled=true;
  try{const j=await call(a,{id});
    if(a==="ready"){const p=j.push||{}; toast(p.sent?"وصل التنبيه لجوال العميل ✓":"العميل ما فعّل التنبيه — نادِه برقم الطلب")}
    load()}catch(e){btn.disabled=false;if(e.message!=="pin")toast("تعذّر التحديث، حاول مرة ثانية")}
}
function ago(t){const m=Math.max(0,Math.round((Date.now()-new Date(t))/60000));return m<1?"الآن":"منذ "+m+" د"}
async function load(){
  clearTimeout(timer);
  try{const {orders}=await call("list",{branch:$("#branch").value});
    $("#list").innerHTML=orders.length?orders.map(o=>`<article class="card" data-s="${o.status}">
      <header><span class="n">#${o.num}</span><span class="chip">${o.status==="ready"?"جاهز":"قيد التحضير"}</span></header>
      <div class="meta">${ago(o.created_at)}</div>
      <div class="badges">${o.subs?`<span class="b on">🔔 التنبيه مفعّل</span>`:`<span class="b off">بدون تنبيه</span>`}${o.arrived?`<span class="b here">العميل وصل</span>`:""}</div>
      ${o.status==="preparing"?`<button class="btn primary" data-id="${o.id}" data-a="ready">جاهز — نبّه العميل</button>`
       :`<div class="row"><button class="btn ghost" data-id="${o.id}" data-a="ready">نبّه مرة ثانية</button><button class="btn green" data-id="${o.id}" data-a="picked">تم التسليم</button></div>`}
      <button class="btn ghost" style="margin-top:6px;padding:6px;font-size:13px" data-qr='${JSON.stringify({id:o.id,num:o.num})}'>عرض الرمز</button>
    </article>`).join(""):`<div class="empty">لا توجد طلبات مفتوحة في هذا الفرع</div>`;
  }catch(e){}
  timer=setTimeout(load,5000);
}
$("#list").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.qr){showQR(JSON.parse(b.dataset.qr));window.scrollTo({top:0,behavior:"smooth"});return}
  act(b.dataset.id,b.dataset.a,b)});
if(pin){login(pin)}else{$("#login").hidden=false}
</script>
</body>
</html>
